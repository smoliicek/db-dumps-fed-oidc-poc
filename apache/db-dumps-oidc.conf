# db-dumps OIDC POC
# ${VAR} values are expanded from the container environment when httpd starts (see .env).

# --- Browser login (authorization code flow, confidential client "db-dumps") ---
OIDCProviderMetadataURL ${KC_REALM_URL}/.well-known/openid-configuration
OIDCClientID            ${OIDC_CLIENT_ID}
OIDCClientSecret        ${OIDC_CLIENT_SECRET}
OIDCCryptoPassphrase    ${OIDC_CRYPTO_PASSPHRASE}

OIDCRedirectURI ${PUBLIC_BASE_URL}/infra/db-dumps/oidc_callback
OIDCScope "openid profile"
OIDCRemoteUserClaim preferred_username
OIDCSessionInactivityTimeout 3600

# --- Bearer tokens (oidc-agent / curl), validated by introspection ---
# Introspection rather than local JWT validation, to mirror Ipsilon's opaque tokens.
OIDCOAuthIntrospectionEndpoint     ${KC_REALM_URL}/protocol/openid-connect/token/introspect
OIDCOAuthIntrospectionEndpointAuth client_secret_basic
OIDCOAuthClientID                  ${OIDC_CLIENT_ID}
OIDCOAuthClientSecret              ${OIDC_CLIENT_SECRET}
OIDCOAuthRemoteUserClaim           preferred_username

# cloudflared terminates TLS and forwards plain http; trust its forwarded scheme - uncomment if running behind CFT
# OIDCXForwardedHeaders X-Forwarded-Proto

# Debug logging for the POC: shows the introspection response incl. the groups claim
LogLevel auth_openidc:debug

<Location /infra/db-dumps>
    # auth-openidc = accept either a browser session cookie or an Authorization: Bearer token
    AuthType auth-openidc

    # Non-browser clients without a token get 401 instead of a 302 to the login page,
    # so scripts fail loudly instead of saving an HTML login page as a "dump"
    OIDCUnAuthAction 401 "%{HTTP_ACCEPT} !~ m#text/html#"

    # Authenticated but not in the group -> 403 (Apache would otherwise send 401)
    AuthzSendForbiddenOnFailure On

    Require claim groups:${REQUIRED_GROUP}
</Location>
